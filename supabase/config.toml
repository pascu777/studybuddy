# Study Up — configurazione Supabase locale (usata da `supabase start` / `supabase db reset`).
project_id = "study-up"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# URL base dell'app usata per i redirect (deep link). Deve combaciare con expo.scheme.
site_url = "studybuddy://"
additional_redirect_urls = [
  "studybuddy://",
  "studybuddy://sign-in",
  "studybuddy://reset-password",
  "http://localhost:8081",
  "http://localhost:8081/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[storage]
enabled = true
file_size_limit = "10MiB"
